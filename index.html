<!doctype html>
<html lang="en">
    <head>  
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CAL</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id ="cal">
            <input id="screen" readonly>
                <div id="keys">
                    <button onclick="append('+')" class = "operator" > + </button>
                    <button onclick="append('-')" class = "operator" > - </button>
                    <button onclick="clearDisplay()" class = "c-operator" > AC </button>
                    <button onclick="del()" class = "c-operator" > DEL </button>
                    <button onclick="append('7')"> 7 </button>
                    <button onclick="append('8')"> 8 </button>
                    <button onclick="append('9')"> 9 </button>
                    <button onclick="append('*')" class = "operator"> * </button>
                    <button onclick="append('4')"> 4 </button>
                    <button onclick="append('5')"> 5 </button>
                    <button onclick="append('6')"> 6 </button>
                    <button onclick="append('/')" class = "operator"> / </button>
                    <button onclick="append('1')"> 1 </button>
                    <button onclick="append('2')"> 2 </button>
                    <button onclick="append('3')"> 3 </button>
                    <button onclick="append('.')" class = "operator"> . </button>
                </div>
            <button class = "e-operator" onclick="equal()">=</button>
        </div>
        <script src="index.js"></script>
    </body>
</html>
